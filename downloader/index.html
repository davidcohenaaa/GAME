<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מוריד סרטונים</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --fg:#1d2330; --muted:#667085; --accent:#e60023; --line:#e4e7ec; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12151c; --card:#1b1f29; --fg:#eef0f4; --muted:#98a2b3; --line:#2b3140; }
  }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px system-ui,sans-serif; padding:24px 16px }
  main { max-width:560px; margin:0 auto }
  h1 { font-size:24px; margin:0 0 4px }
  p.sub { color:var(--muted); margin:0 0 20px }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px }
  .row { display:flex; gap:8px; flex-wrap:wrap }
  input[type=url] { flex:1; min-width:0; padding:12px; border:1px solid var(--line); border-radius:10px;
    background:var(--bg); color:var(--fg); font-size:16px; direction:ltr }
  select { padding:12px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--fg); font-size:16px }
  button, a.btn { padding:12px 18px; border:0; border-radius:10px; background:var(--accent); color:#fff;
    font-size:16px; cursor:pointer; text-decoration:none; text-align:center }
  button:disabled { opacity:.5; cursor:wait }
  #preview { display:none; margin-top:16px }
  #preview img { width:100%; border-radius:10px; margin-bottom:10px }
  #preview h2 { font-size:17px; margin:0 0 4px }
  #meta { color:var(--muted); margin:0 0 12px; font-size:14px }
  #status { margin-top:12px; min-height:1.4em; color:var(--muted) }
  #status.err { color:#d92d20 }
  .hint { margin-top:20px; color:var(--muted); font-size:13px }
</style>
</head>
<body>
<main>
  <h1>מוריד סרטונים</h1>
  <p class="sub">פינטרסט, אינסטגרם, טיקטוק, טוויטר/X, פייסבוק, יוטיוב, ריידיט ועוד אלפי אתרים.</p>
  <div class="card">
    <div class="row">
      <input id="url" type="url" placeholder="הדבק קישור לסרטון…" autofocus>
      <button id="go">חפש</button>
    </div>
    <div id="status"></div>
    <div id="preview">
      <img id="thumb" alt="">
      <h2 id="title"></h2>
      <p id="meta"></p>
      <div class="row">
        <a class="btn" id="dl" href="#">הורד MP4</a>
      </div>
    </div>
  </div>
  <p class="hint">להורדת תכנים שיש לך זכות להוריד בלבד — כבד זכויות יוצרים ותנאי שימוש של האתרים.</p>
</main>
<script>
const $ = id => document.getElementById(id);
const status = (t, err) => { $('status').textContent = t; $('status').className = err ? 'err' : ''; };

function updateLink() {
  $('dl').href = '/api/download?' + new URLSearchParams({ url: $('url').value.trim() });
}

$('go').onclick = async () => {
  const url = $('url').value.trim();
  if (!url) return;
  $('go').disabled = true; $('preview').style.display = 'none'; status('מחפש…');
  try {
    const r = await fetch('/api/info?' + new URLSearchParams({ url }));
    const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    $('thumb').style.display = d.thumbnail ? '' : 'none';
    if (d.thumbnail) $('thumb').src = d.thumbnail;
    $('title').textContent = d.title || 'ללא כותרת';
    const mins = d.duration ? Math.floor(d.duration / 60) + ':' + String(Math.round(d.duration % 60)).padStart(2, '0') : '';
    $('meta').textContent = [d.site, d.uploader, mins].filter(Boolean).join(' · ');
    updateLink(); $('preview').style.display = 'block'; status('');
  } catch (e) { status(e.message || 'שגיאה', true); }
  $('go').disabled = false;
};
$('url').addEventListener('keydown', e => e.key === 'Enter' && $('go').click());
$('dl').onclick = () => status('ההורדה התחילה… ייתכן שייקח כמה רגעים.');
</script>
</body>
</html>
