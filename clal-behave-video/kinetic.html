<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>כלל BEHAVE – קינטי</title>
<style>
  @font-face{font-family:'Heebo';font-weight:100 900;src:url(fonts/heebo-hebrew.woff2) format('woff2');unicode-range:U+0307-0308,U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
  @font-face{font-family:'Heebo';font-weight:100 900;src:url(fonts/heebo-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
  /* פלטת כלל (קירוב) */
  :root{--navy:#00205b;--blue:#0047bb;--sky:#00a3e0;--ice:#e8f3fc;--mist:#c9d9ea;--steel:#8fa6bf;--slate:#5f6f82;--pale:#dfe6ee}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1080px;height:1920px;overflow:hidden;background:#000;font-family:'Heebo',sans-serif}
  #stage{position:relative;width:1080px;height:1920px;overflow:hidden}
  .sc{position:absolute;inset:0;display:none;overflow:hidden}
  .sc::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 40%,rgba(255,255,255,.12),rgba(0,0,0,.14) 100%)}
  .w{position:absolute;left:0;right:0;text-align:center;color:#fff;font-weight:900;line-height:1;white-space:nowrap}
  .obj{position:absolute;left:50%;transform:translateX(-50%)}
  .shadow{position:absolute;left:50%;width:70%;height:40px;transform:translateX(-50%);border-radius:50%;background:rgba(0,0,0,.28);filter:blur(14px)}
  .half{position:absolute;left:0;right:0;height:50%;overflow:hidden}
  .ch{display:inline-block}

  @keyframes in{from{opacity:0}to{opacity:1}}
  @keyframes dim{from{opacity:1}to{opacity:.35}}
  @keyframes up{from{opacity:0;transform:translateY(80px)}to{opacity:1;transform:none}}
  @keyframes pop{0%{opacity:0;transform:scale(.6)}60%{opacity:1;transform:scale(1.06)}100%{transform:scale(1)}}
  @keyframes push{from{transform:scale(1)}to{transform:scale(1.08)}}
  @keyframes pushObj{from{transform:translateX(-50%) scale(1)}to{transform:translateX(-50%) scale(1.06)}}
  @keyframes fromR{from{transform:translateX(900px)}to{transform:none}}
  @keyframes fromL{from{transform:translateX(-900px)}to{transform:none}}
  @keyframes objL{from{transform:translateX(-160%)}to{transform:translateX(-50%)}}
  @keyframes objR{from{transform:translateX(60%)}to{transform:translateX(-50%)}}
  @keyframes objUp{from{opacity:0;transform:translate(-50%,120px)}to{opacity:1;transform:translate(-50%,0)}}
  @keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
  @keyframes slideDown{from{transform:translateY(-100%)}to{transform:none}}
  @keyframes wipe{from{clip-path:inset(0 0 0 100%)}to{clip-path:inset(0 0 0 0)}}
  @keyframes wipeR{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
  @keyframes glow{from{opacity:.25}to{opacity:1}}
  @keyframes fallOut{0%{transform:none;opacity:1}100%{transform:translateY(160px) rotate(var(--r));opacity:0}}
  @keyframes dropIn{0%{transform:translateY(-140px) rotate(var(--r));opacity:0}100%{transform:none;opacity:1}}
  @keyframes spinWheel{to{transform:rotate(-720deg)}}
  @keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
  @keyframes roofL{from{transform:rotate(-38deg);opacity:0}to{transform:none;opacity:1}}
  @keyframes roofR{from{transform:rotate(38deg);opacity:0}to{transform:none;opacity:1}}
  .psign{position:absolute;top:300px;right:110px;width:150px;height:150px;border-radius:30px;background:var(--blue);color:#fff;font:900 110px/150px 'Heebo';text-align:center;direction:ltr}
  .days{position:absolute;top:1250px;left:0;right:0;display:flex;justify-content:center;gap:26px}
  .day{width:150px;height:150px;border-radius:26px;border:5px solid rgba(255,255,255,.3);color:rgba(255,255,255,.35);font:800 70px/140px 'Heebo';text-align:center;transition:none}
  .day.on{background:#fff;color:var(--navy);border-color:#fff}
  .day.drive{background:var(--sky);color:#fff;border-color:var(--sky)}
  .row{position:absolute;left:-400px;right:-400px;text-align:center;font:900 130px/160px 'Heebo';white-space:nowrap;opacity:0}
  .road{position:absolute;top:1046px;left:0;right:0;height:10px;background:repeating-linear-gradient(90deg,#fff 0 70px,transparent 70px 120px);opacity:.8}
  .carshadow{position:absolute;top:1025px;left:0;width:540px;height:34px;border-radius:50%;background:rgba(0,0,0,.25);filter:blur(12px)}
  .drivecar{position:absolute;top:792px;left:0}
  #lineLayer{position:absolute;inset:0;width:1080px;height:1920px;pointer-events:none;z-index:5}
</style>
</head>
<body>
<div id="stage"></div>

<!-- אובייקטים (איורים שטוחים במקום צילומי מוצר) -->
<template id="car">
  <svg viewBox="0 0 520 220" width="__W__">
    <path d="M30 150 Q28 110 70 100 L150 90 Q190 40 260 36 L340 36 Q390 38 430 90 L470 100 Q500 108 498 150 L496 166 Q495 176 484 176 L40 176 Q30 176 30 166 Z" fill="#0047bb"/>
    <path d="M168 92 Q200 52 262 50 L300 50 L300 94 Z" fill="#cfe6f7"/>
    <path d="M316 50 L338 50 Q378 52 410 94 L316 94 Z" fill="#cfe6f7"/>
    <rect x="300" y="50" width="16" height="44" fill="#0047bb"/>
    <path d="M40 132 H490" stroke="#00a3e0" stroke-width="8" stroke-linecap="round"/>
    <rect x="452" y="112" width="34" height="14" rx="6" fill="#fff8d6"/>
    <rect x="34" y="112" width="22" height="14" rx="6" fill="#ff6b6b"/>
    <g class="wheel" style="transform-origin:135px 176px"><circle cx="135" cy="176" r="40" fill="#11213f"/><circle cx="135" cy="176" r="18" fill="#c9d9ea"/><path d="M135 158 V194 M117 176 H153" stroke="#11213f" stroke-width="5"/></g>
    <g class="wheel" style="transform-origin:395px 176px"><circle cx="395" cy="176" r="40" fill="#11213f"/><circle cx="395" cy="176" r="18" fill="#c9d9ea"/><path d="M395 158 V194 M377 176 H413" stroke="#11213f" stroke-width="5"/></g>

<template id="laptop">
  <svg viewBox="0 0 400 260" width="__W__">

    <rect x="74" y="24" width="252" height="160" rx="6" fill="#00a3e0"/>
    <rect x="96" y="48" width="120" height="16" rx="8" fill="#fff" opacity=".9"/>
    <rect x="96" y="76" width="200" height="12" rx="6" fill="#fff" opacity=".55"/>
    <rect x="96" y="98" width="170" height="12" rx="6" fill="#fff" opacity=".55"/>
    <rect x="96" y="128" width="80" height="34" rx="10" fill="#0047bb"/>

      <rect x="40" y="180" width="220" height="40"/><ellipse cx="150" cy="180" rx="110" ry="30"/>

    <text x="150" y="156" text-anchor="middle" font-family="Heebo" font-weight="900" font-size="54" fill="#c99a1e">₪</text>

<template id="phone">

    <rect x="10" y="10" width="220" height="420" rx="34" fill="#11213f"/>
    <rect x="24" y="40" width="192" height="360" rx="18" fill="#fff"/>
    <rect x="90" y="22" width="60" height="8" rx="4" fill="#33466b"/>
    <circle cx="120" cy="170" r="72" fill="none" stroke="#e8f3fc" stroke-width="18"/>
    <circle cx="120" cy="170" r="72" fill="none" stroke="#00a3e0" stroke-width="18" stroke-linecap="round" stroke-dasharray="452" stroke-dashoffset="40" transform="rotate(-90 120 170)" class="ring"/>
    <text x="120" y="190" text-anchor="middle" font-family="Heebo" font-weight="900" font-size="58" fill="#00205b">92</text>
    <rect x="50" y="270" width="140" height="14" rx="7" fill="#c9d9ea"/>
    <rect x="66" y="298" width="108" height="14" rx="7" fill="#e8f3fc"/>
    <rect x="60" y="334" width="120" height="40" rx="20" fill="#0047bb"/>
  </svg>
</template>
<template id="shield">
  <svg viewBox="0 0 300 340" width="__W__">
    <path d="M150 14 L270 58 V160 C270 250 214 306 150 326 C86 306 30 250 30 160 V58 Z" fill="#fff"/>
    <path d="M150 44 L244 78 V160 C244 232 200 278 150 296 C100 278 56 232 56 160 V78 Z" fill="#0047bb"/>
    <path d="M100 170 L138 208 L206 134" stroke="#fff" stroke-width="24" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</template>
<template id="bt">
  <svg viewBox="0 0 120 120" width="__W__"><circle cx="60" cy="60" r="56" fill="#0047bb"/><path d="M42 40 L78 76 L60 94 V26 L78 44 L42 80" stroke="#fff" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
</template>

<script>
const T = 26.0; // משך כולל
const tpl = (id, w) => document.getElementById(id).innerHTML.replace('__W__', w);
const A = (name, at, dur = .45, ease = 'cubic-bezier(.2,.8,.2,1)') => `animation:${name} ${dur}s ${ease} ${at}s both;`;
const chars = (txt, at, step, name, extra = '') =>
  [...txt].map((c, i) => c === ' ' ? ' ' : `<span class="ch" style="${A(name, at + i * step, .35)}${extra.replace('$i', i)}">${c}</span>`).join('');
const spans = (txt, cls) => [...txt].map(c => c === ' ' ? '<span class="ch">&nbsp;</span>' : `<span class="ch ${cls}">${c}</span>`).join('');
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => 1 - Math.pow(1 - clamp(x), 3);
const easeIO = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const lerp = (a, b, x) => a + (b - a) * x;

// ---------- הקו הרציף: קו אחד שעובר בין הסצנות ומשנה צורה ----------
const N = 240;
const resample = pts => { // דגימה מחדש של פוליליין ל-N נקודות לפי אורך
  const seg = [], L = [0];
  for (let i = 1; i < pts.length; i++) { const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); L.push(L[i - 1] + d); }
  const tot = L[L.length - 1], out = [];
  for (let k = 0, j = 1; k < N; k++) {
    const d = tot * k / (N - 1);
    while (j < L.length - 1 && L[j] < d) j++;
    const f = (d - L[j - 1]) / ((L[j] - L[j - 1]) || 1);
    out.push([lerp(pts[j - 1][0], pts[j][0], f), lerp(pts[j - 1][1], pts[j][1], f)]);
  }
  return out;
};
const line = (x1, x2, y) => resample([[x1, y], [x2, y]]);
const rect = (x1, y1, x2, y2) => resample([[x2, y2], [x1, y2], [x1, y1], [x2, y1], [x2, y2]]);
const GR = 400, GCX = 540, GCY = 1080; // ספידומטר
const gaugeArc = () => resample(Array.from({ length: 80 }, (_, i) => { const a = Math.PI * (1 - i / 79); return [GCX + GR * Math.cos(a), GCY - GR * Math.sin(a)]; }));
const SH = {
  house: resample([[880, 1220], [200, 1220], [200, 780], [540, 440], [880, 780], [880, 1220]]),
  ground: line(-60, 1140, 1164),
  bay: resample([[170, 1180], [170, 560], [910, 560], [910, 1180]]),
  ulAz: line(400, 680, 1120),
  ulCoins: line(240, 840, 1250),
  divider: line(140, 940, 905),
  ulBrand: line(140, 940, 1070),
  road: line(-60, 1140, 1046),
  phoneA: rect(268, 738, 692, 1480),
  phoneB: rect(318, 838, 762, 1616),
  ul247: line(240, 840, 1200),
  gauge: gaugeArc(),
  ulWork: line(260, 820, 1110),
  split: line(-60, 1140, 960),
  ulLogo: line(200, 880, 960),
};
// מפתחות: זמן, צורה, צבע, שקיפות, כמה מהקו מצויר
const K = [
  [0.0, 'house', '#ffffff', 1, 0], [0.7, 'house', '#ffffff', 1, 1], [1.7, 'house', '#ffffff', 1, 1],
  [2.15, 'ground', '#ffffff', 1, 1], [3.0, 'ground', '#ffffff', 1, 1],
  [3.45, 'bay', '#ffffff', 1, 1], [4.85, 'bay', '#ffffff', 1, 1],
  [5.15, 'ulAz', '#ffffff', 1, 1], [6.0, 'ulAz', '#ffffff', 1, 1],
  [6.3, 'ulCoins', '#ffd166', 1, 1], [7.0, 'ulCoins', '#ffd166', 1, 1],
  [7.25, 'divider', '#00205b', 1, 1], [7.55, 'divider', '#00205b', 1, 1],
  [7.65, 'divider', '#00205b', 0, 1], [9.2, 'ulBrand', '#0047bb', 0, 1],
  [9.6, 'ulBrand', '#0047bb', 1, 1], [10.0, 'ulBrand', '#0047bb', 1, 1], [10.05, 'ulBrand', '#ffffff', 1, 1], [10.75, 'ulBrand', '#ffffff', 1, 1],
  [11.0, 'road', '#ffffff', 1, 1], [13.75, 'road', '#ffffff', 1, 1],
  [14.15, 'phoneA', '#0047bb', 1, 1], [15.25, 'phoneA', '#0047bb', 1, 1],
  [15.6, 'phoneB', '#ffffff', 1, 1], [16.75, 'phoneB', '#ffffff', 1, 1],
  [17.1, 'ul247', '#00205b', 1, 1], [17.75, 'ul247', '#00205b', 1, 1],
  [18.2, 'gauge', '#ffffff', 1, 1], [20.5, 'gauge', '#ffffff', 1, 1],
  [20.8, 'ulWork', '#ffffff', 1, 1], [21.1, 'ulWork', '#ffffff', 1, 1], [21.15, 'ulWork', '#00205b', 1, 1], [21.7, 'ulWork', '#00205b', 1, 1],
  [22.0, 'split', '#ffffff', 1, 1], [23.5, 'split', '#ffffff', 1, 1],
  [23.9, 'ulLogo', '#0047bb', 1, 1], [T, 'ulLogo', '#0047bb', 1, 1],
];
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, f) => { const x = hex(a), y = hex(b); return `rgb(${x.map((v, i) => Math.round(lerp(v, y[i], f))).join(',')})`; };
function drawLine(t) {
  let i = 0; while (i < K.length - 2 && K[i + 1][0] <= t) i++;
  const [t0, s0, c0, o0, d0] = K[i], [t1, s1, c1, o1, d1] = K[i + 1];
  const f = easeIO((t - t0) / ((t1 - t0) || 1));
  const a = SH[s0], b = SH[s1];
  const pts = a.map((p, k) => [lerp(p[0], b[k][0], f), lerp(p[1], b[k][1], f)]);
  const el = document.getElementById('gline');
  el.setAttribute('points', pts.map(p => p.map(v => v.toFixed(1)).join(',')).join(' '));
  el.setAttribute('stroke', mix(c0, c1, f));
  el.setAttribute('opacity', lerp(o0, o1, f));
  el.setAttribute('stroke-dashoffset', 1 - lerp(d0, d1, f));
}

// כל סצנה: התחלה, סוף, רקע, תוכן (זמנים אבסולוטיים) ופונקציית עדכון לכל פריים
const S = [];
const sc = (s, e, bg, html, upd) => S.push({ s, e, bg, html: html(s), upd });

// 1 – "עובדים" נופלים לתוך הבית
sc(0, 2.0, '#7f9bb8', s => `
  <div class="w" style="top:880px;font-size:190px">${[...'עובדים'].map((c, i) => `<span class="ch" style="--r:${(i % 2 ? -1 : 1) * 18}deg;${A('dropIn', s + .45 + i * .07, .4)}">${c}</span>`).join('')}</div>
  <div class="w" style="top:1330px;font-size:170px;${A('up', s + 1.2, .35)}">מהבית?</div>`);

// 2 – הרכב שלכם (הרכב נוחת על הקו)
sc(2.0, 3.0, 'var(--steel)', s => `
  <div class="w" style="top:700px;font-size:300px;${A('in', s, .2)}">הרכב</div>
  <div class="obj" style="top:820px;${A('objL', s, .55)}">${tpl('car', 820)}</div>
  <div class="w" style="top:1240px;font-size:130px;${A('up', s + .45, .3)}">שלכם</div>`);

// 3 – "חונה" בתוך משבצת החניה, והימים חולפים
const days = ['א׳', 'ב׳', 'ג׳', 'ד׳', 'ה׳'];
sc(3.0, 5.0, '#3b4757', s => `
  <div class="psign" style="${A('pop', s + .3, .35)}">P</div>
  <div class="w" style="top:740px;font-size:270px;${A('in', s + .3, .2)}">חונה</div>
  <div class="days">${days.map((d, i) => `<span class="day" data-i="${i}">${d}</span>`).join('')}</div>
  <div class="w" style="top:1560px;font-size:100px;${A('up', s + 1.4, .35)}">רוב השבוע?</div>`,
  (t, el, s) => {
    el.querySelectorAll('.day').forEach((d, i) => {
      const on = t >= s + .55 + i * .22;
      d.classList.toggle('on', on && i !== 1);
      d.classList.toggle('drive', on && i === 1); // יום אחד במשרד
    });
  });

// 4 – אז / למה
sc(5.0, 5.5, 'var(--slate)', s => `<div class="w" style="top:860px;font-size:220px;${A('in', s, .12)}">אז</div>`);
sc(5.5, 6.0, 'var(--slate)', s => `<div class="w" style="top:860px;font-size:220px;${A('in', s, .12)}">למה</div>`);

// 5 – לשלם
sc(6.0, 7.0, 'var(--blue)', s => `
  <div class="w" style="top:760px;font-size:280px;${A('in', s, .15)}">לשלם</div>
  <div class="obj" style="top:880px;${A('objUp', s + .1, .45)}">${tpl('coins', 380)}</div>`);

// 6 – כמו מי שנוסע / "כל יום" שמתרבה ומסתחרר
sc(7.0, 7.6, 'var(--steel)', s => `
  <div class="w" style="top:720px;font-size:170px;${A('in', s, .12)}">כמו מי</div>
  <div class="w" style="top:930px;font-size:170px;color:var(--navy);${A('up', s + .2, .25)}">שנוסע</div>`);
const ROWS = 12;
sc(7.6, 8.75, 'var(--sky)', s => Array.from({ length: ROWS }, (_, i) =>
  `<div class="row" data-i="${i}" style="top:${i * 160}px;color:${i % 2 ? 'var(--navy)' : '#fff'}">${'כל יום · '.repeat(8)}</div>`).join(''),
  (t, el, s) => {
    const lt = t - s;
    el.querySelectorAll('.row').forEach((r, i) => {
      const order = [5, 6, 4, 7, 3, 8, 2, 9, 1, 10, 0, 11].indexOf(i);
      const appear = .9 * Math.sqrt(order / ROWS); // מאיץ
      const dist = (lt * lt * 900 + lt * 300) * (i % 2 ? 1 : -1); // מהירות עולה
      r.style.opacity = clamp((lt - appear) / .08);
      r.style.transform = `translateX(${(dist % 640) - 320}px) skewX(${clamp(lt) * (i % 2 ? -12 : 12)}deg)`;
    });
  });
sc(8.75, 9.25, 'var(--navy)', s => `
  <div class="w" style="top:820px;font-size:220px">כל יום<span style="display:inline-block;color:var(--sky);${A('pop', s + .1, .3)}">?</span></div>`);

// 7 – הכירו את כלל BEHAVE (הטקסט ממשיך מעבר לחיתוך הרקע)
sc(9.25, 10.0, 'var(--pale)', s => `
  <div class="w" style="top:700px;font-size:110px;color:var(--slate);${A('in', s, .3)}">הכירו את</div>
  <div class="w" style="top:860px;font-size:170px;color:var(--blue);${A('fromR', s + .2, .55)}">כלל BEHAVE</div>`);
sc(10.0, 10.75, 'var(--navy)', s => `
  <div class="w" style="top:860px;font-size:170px;${A('push', s, .75, 'linear')}">כלל <span style="color:var(--sky)">BEHAVE</span></div>`);

// 8 – המכונית נוסעת על הקו: מעיפה את "נוסעים" ומשאירה אחריה "יכולים לשלם"
const CAR_W = 600, DRIVE0 = 11.0, DRIVE1 = 12.4;
sc(10.75, 13.75, 'var(--sky)', s => `
  <div class="w" style="top:720px;font-size:220px">${spans('נוסעים', 'o')}</div>
  <div class="w" style="top:760px;font-size:150px;color:var(--navy)">${spans('יכולים לשלם', 'n')}</div>
  <div class="carshadow"></div>
  <div class="drivecar"><div style="transform:scaleX(-1)">${tpl('car', CAR_W)}</div></div>
  <div class="w" style="top:1160px;font-size:270px;${A('up', s + .2, .35)}">פחות</div>`,
  (t, el, s) => {
    const car = el.querySelector('.drivecar'), sh = el.querySelector('.carshadow');
    const u = (t - DRIVE0) / (DRIVE1 - DRIVE0);
    const x = lerp(1180, -CAR_W - 120, ease(u) * .35 + clamp(u) * .65);
    car.style.transform = `translateX(${x}px) translateY(${Math.sin(t * 40) * 2}px)`;
    sh.style.transform = `translateX(${x + 40}px)`;
    car.querySelectorAll('.wheel').forEach(w => w.style.transform = `rotate(${-(1180 - x) * 1.1}deg)`);
    if (!el._pos) { // מיקומי האותיות נמדדים פעם אחת, לפני טרנספורמציות
      el._pos = [...el.querySelectorAll('.ch.o, .ch.n')].map(c => { const r = c.getBoundingClientRect(); return [c, r.left + r.width / 2]; });
    }
    el._pos.forEach(([c, cx]) => {
      if (c.classList.contains('o')) { // החזית עוברת → האות עפה
        const p = clamp((cx - x) / 160);
        c.style.transform = `translate(${-80 * p}px, ${-320 * p}px) rotate(${-50 * p}deg)`;
        c.style.opacity = 1 - p;
      } else { // הזנב עובר → האות נוחתת
        const q = ease((cx - (x + CAR_W)) / 170);
        c.style.transform = `translateY(${-140 * (1 - q)}px) rotate(${(1 - q) * 25}deg)`;
        c.style.opacity = q;
      }
    });
  });

// 9 – אפליקציה חכמה שמלווה את הנהיגה שלכם (הקו ממסגר את הטלפון)
sc(13.75, 15.25, 'var(--ice)', s => `
  <div class="w" style="top:330px;font-size:130px;color:var(--blue);${A('in', s, .15)}">אפליקציה חכמה</div>
  <div class="w" style="top:500px;font-size:70px;color:var(--slate);font-weight:700;${A('up', s + .35, .3)}">שמלווה את הנהיגה שלכם</div>
  <div class="obj" style="top:760px;margin-left:-60px;${A('objUp', s + .15, .45)}">${tpl('phone', 380)}</div>
  <div class="obj" style="top:860px;margin-left:250px;${A('pop', s + .6, .4)}">${tpl('bt', 170)}</div>`);

// 10 – משוב אחרי כל נסיעה
sc(15.25, 16.75, 'var(--blue)', s => `
  <div class="w" style="top:330px;font-size:250px">${chars('משוב', s, .08, 'glow')}</div>
  <div class="w" style="top:610px;font-size:80px;color:var(--ice);font-weight:700;${A('up', s + .45, .35)}">אחרי כל נסיעה</div>
  <div class="obj" style="top:860px;${A('objUp', s + .3, .5)}">${tpl('phone', 400)}</div>`);

// 11 – ליווי אישי 24/7
sc(16.75, 17.75, 'var(--steel)', s => `
  <div class="w" style="top:620px;font-size:150px;${A('in', s, .15)}">ליווי אישי</div>
  <div class="w" style="top:840px;font-size:340px;color:var(--navy);direction:ltr;${A('pop', s + .3, .4)}">24/7</div>`);

// 12 – ספידומטר: מחיר הביטוח יורד ב-33%
const pt = (v, r) => { const a = Math.PI * (1 - v / 100); return [GCX + r * Math.cos(a), GCY - r * Math.sin(a)]; };
const arcD = (v0, v1, r) => { const [x0, y0] = pt(v0, r), [x1, y1] = pt(v1, r); return `M${x0} ${y0} A${r} ${r} 0 0 1 ${x1} ${y1}`; };
const ticks = Array.from({ length: 11 }, (_, i) => { const v = i * 10, [x1, y1] = pt(v, GR - 30), [x2, y2] = pt(v, GR - (i % 5 ? 65 : 95)); return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#fff" stroke-width="${i % 5 ? 6 : 12}" stroke-linecap="round" opacity=".8"/>`; }).join('');
sc(17.75, 20.5, 'var(--navy)', s => `
  <div class="w" style="top:330px;font-size:110px;${A('in', s + .1, .25)}">וחיסכון של עד</div>
  <svg style="position:absolute;inset:0" viewBox="0 0 1080 1920">
    <g style="${A('in', s + .35, .3)}">${ticks}
      <text x="${GCX}" y="${GCY + 100}" text-anchor="middle" font-family="Heebo" font-weight="700" font-size="44" fill="#fff" opacity=".7">מחיר הביטוח</text>
      <text x="${GCX - GR}" y="${GCY + 70}" text-anchor="middle" font-family="Heebo" font-weight="700" font-size="40" fill="#fff" opacity=".6">0</text>
      <text x="${GCX + GR}" y="${GCY + 70}" text-anchor="middle" font-family="Heebo" font-weight="700" font-size="40" fill="#fff" opacity=".6">100%</text>
    </g>
    <path id="gFill" fill="none" stroke="#00a3e0" stroke-width="60"/>
    <path id="gSave" fill="none" stroke="#7fd3f5" stroke-width="60" stroke-dasharray="14 10"/>
    <g id="needle" style="${A('in', s + .45, .2)}"><path d="M${GCX} ${GCY - 20} L${GCX - GR + 60} ${GCY} L${GCX} ${GCY + 20} Z" fill="#fff"/><circle cx="${GCX}" cy="${GCY}" r="38" fill="#0047bb" stroke="#fff" stroke-width="10"/></g>
  </svg>
  <div class="w" style="top:1200px;font-size:300px;color:var(--sky);direction:ltr"><span id="gv">0</span>%<span style="font-size:160px;vertical-align:top">*</span></div>
  <div class="w" style="top:1540px;font-size:100px;${A('up', s + 1.6, .35)}">בביטוח המקיף</div>`,
  (t, el, s) => {
    const lt = t - s;
    // מחוג: עולה למחיר מלא (100), ואז צונח ומתייצב על 67
    let v;
    if (lt < .9) v = lerp(0, 100, ease((lt - .45) / .45));
    else v = 67 + 33 * Math.exp(-(lt - .9) * 4.5) * Math.cos((lt - .9) * 7);
    v = clamp(v, 0, 100);
    const fillIn = clamp((lt - .45) / .2);
    el.querySelector('#needle').setAttribute('transform', `rotate(${v / 100 * 180} ${GCX} ${GCY})`);
    el.querySelector('#gFill').setAttribute('d', arcD(0.01, Math.max(.02, v), GR));
    el.querySelector('#gFill').setAttribute('opacity', fillIn);
    const saved = lt > .9 ? Math.max(0, 100 - v) : 0;
    el.querySelector('#gSave').setAttribute('d', saved > .5 ? arcD(v, 100, GR) : '');
    el.querySelector('#gv').textContent = Math.round(clamp(saved, 0, 33));
  });

// 13 – עובדים / מהבית?
sc(20.5, 21.1, 'var(--sky)', s => `<div class="w" style="top:860px;font-size:200px;${A('in', s, .12)}">עובדים</div>`);
sc(21.1, 21.7, 'var(--mist)', s => `<div class="w" style="top:860px;font-size:200px;color:var(--navy);${A('in', s, .12)}">מהבית?</div>`);

// 14 – מסך מפוצל (הקו הופך לקו החיתוך): תנו גם לביטוח שלכם / לעבוד חכם יותר
sc(21.7, 23.5, 'var(--blue)', s => `
  <div class="half" style="top:0;background:var(--blue);${A('slideDown', s, .3)}">
    <div class="w" style="top:520px;font-size:96px">תנו גם לביטוח שלכם</div>
  </div>
  <div class="half" style="top:50%;background:var(--ice);${A('slideUp', s + .35, .35)}">
    <div class="w" style="top:260px;font-size:150px;color:var(--navy)">${chars('לעבוד חכם', s + .6, .05, 'glow')}</div>
    <div class="w" style="top:440px;font-size:150px;color:var(--sky);${A('up', s + 1.1, .35)}">יותר.</div>
  </div>`);

// 15 – לוגו + סלוגן על לבן (הקו נהיה קו תחתון ללוגו)
sc(23.5, T, '#ffffff', s => `
  <div class="w" style="top:760px;font-size:150px;color:var(--navy);${A('wipe', s + .3, .7)}">כלל <span style="color:var(--blue)">BEHAVE</span></div>
  <div class="w" style="top:1010px;font-size:66px;color:var(--slate);font-weight:700;${A('up', s + .9, .4)}">נוסעים חכם. <span style="color:var(--sky)">משלמים בהתאם.</span></div>
  <div class="w" style="top:1700px;font-size:30px;color:var(--slate);font-weight:500;white-space:normal;padding:0 80px;line-height:1.4;${A('in', s + 1.2, .4)}">*שיעור החיסכון תלוי באיכות הנהיגה ובהיקף הנסועה. בכפוף לתנאי הפוליסה ולחיתום החברה.</div>`);

// בניית DOM
const stage = document.getElementById('stage');
S.forEach(o => {
  const d = document.createElement('div');
  d.className = 'sc'; d.style.background = o.bg; d.innerHTML = o.html;
  stage.appendChild(d); o.el = d;
});
stage.insertAdjacentHTML('beforeend', `<svg id="lineLayer" viewBox="0 0 1080 1920"><polyline id="gline" fill="none" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1"/></svg>`);
// גלגלים מסתובבים בסצנת "הרכב שלכם"
S[1].el.querySelectorAll('.wheel').forEach(w => w.style.animation = 'spinWheel .55s cubic-bezier(.2,.8,.2,1) 2.0s both');

window.__setTime = t => {
  S.forEach(o => o.el.style.display = (t >= o.s && t < o.e) ? 'block' : 'none');
  document.getAnimations().forEach(a => { a.pause(); a.currentTime = t * 1000; });
  S.forEach(o => { if (o.upd && t >= o.s && t < o.e) o.upd(t, o.el, o.s); });
  drawLine(t);
};
window.__duration = T;
if (!navigator.webdriver) {
  const st = performance.now();
  (function tick(){ __setTime(((performance.now() - st) / 1000) % T); requestAnimationFrame(tick); })();
}
</script>
</body>
</html>
