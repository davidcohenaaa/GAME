<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>תמרורים</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f4e8c'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="wrap">
    <h1>לוח התמרורים</h1>
    <p class="hint">התמרורים והפירושים לקוחים מלוח התמרורים הרשמי של משרד התחבורה (ספטמבר 2022).</p>
    <div class="filters" id="filters" role="group" aria-label="חלקי הלוח"></div>
    <div class="tools" id="tools">
      <input id="search" class="search" type="search" placeholder="חיפוש לפי מספר או פירוש" aria-label="חיפוש תמרור">
      <span id="count" class="meta" aria-live="polite"></span>
    </div>
    <p id="flip-hint" class="hint" hidden>נסה לנחש את הפירוש, ואז לחץ על הכרטיס כדי לראות אותו.</p>
    <ul class="grid signs" id="signs"></ul>
  </main>
  <script type="module" src="js/signs.js"></script>
</body>
</html>
