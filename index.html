<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ראשי</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f4e8c'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <h1>תיאוריה לרכב פרטי</h1>
      <p id="tagline"></p>
    </section>

    <section class="ready" aria-labelledby="ready-h">
      <div class="ready-main">
        <h2 id="ready-h">כמה אתה קרוב לידע?</h2>
        <div class="ready-score"><strong id="ready-pct">0%</strong><span id="ready-label"></span></div>
        <div class="meter" id="ready-meter" role="progressbar" aria-labelledby="ready-h" aria-valuemin="0" aria-valuemax="100"><span></span></div>
        <p class="hint" id="ready-note"></p>
        <div class="actions" id="next-step"></div>
      </div>
      <div class="stats" id="stats"></div>
    </section>

    <section aria-labelledby="path-h">
      <h2 id="path-h">הדרך שלי עד התיאוריה</h2>
      <ol class="path" id="path"></ol>
    </section>

    <section aria-labelledby="more-h">
      <h2 id="more-h">עוד דרכים להתאמן</h2>
      <ul class="grid" id="more"></ul>
    </section>

    <section aria-labelledby="exams-h" id="exams-section" hidden>
      <h2 id="exams-h">מבחנים אחרונים</h2>
      <ul class="exam-list" id="exams"></ul>
    </section>

    <section aria-labelledby="backup-h" class="backup">
      <h2 id="backup-h">שמירת התוצאות</h2>
      <p class="hint">ההתקדמות נשמרת אוטומטית בדפדפן הזה. כדי להעביר אותה למכשיר אחר, או כגיבוי, הורד קובץ ושחזר אותו במקום אחר.</p>
      <div class="actions">
        <button class="btn ghost" id="export" type="button">הורד גיבוי</button>
        <button class="btn ghost" id="import" type="button">שחזר מגיבוי</button>
        <input id="import-file" type="file" accept="application/json,.json" hidden>
      </div>
      <p id="backup-msg" class="hint" role="status"></p>
      <button class="link" id="reset" type="button">איפוס התקדמות</button>
    </section>
  </main>
  <script type="module" src="js/home.js"></script>
</body>
</html>
