    const d = tot * k / (N - 1);
    while (j < L.length - 1 && L[j] < d) j++;
    const f = (d - L[j - 1]) / ((L[j] - L[j - 1]) || 1);
    out.push([lerp(pts[j - 1][0], pts[j][0], f), lerp(pts[j - 1][1], pts[j][1], f)]);
  }
  return out;
};
const seg = (p, q) => resample([p, q]);
const ell = (cx, cy, rx, ry, a0 = 0) => resample(Array.from({ length: 161 }, (_, i) => { const a = a0 + 2 * Math.PI * i / 160; return [cx + rx * Math.cos(a), cy - ry * Math.sin(a)]; }));
const quad = (p0, p1, p2, n = 40) => Array.from({ length: n + 1 }, (_, i) => { const u = i / n; return [(1 - u) * (1 - u) * p0[0] + 2 * u * (1 - u) * p1[0] + u * u * p2[0], (1 - u) * (1 - u) * p0[1] + 2 * u * (1 - u) * p1[1] + u * u * p2[1]]; });
const fillet = (pts, r) => { // פינות מעוגלות בפוליליין
  const out = [pts[0]];
  for (let i = 1; i < pts.length - 1; i++) {
    const [p0, p1, p2] = [pts[i - 1], pts[i], pts[i + 1]];
    const d1 = Math.hypot(p1[0] - p0[0], p1[1] - p0[1]), d2 = Math.hypot(p2[0] - p1[0], p2[1] - p1[1]), rr = Math.min(r, d1 / 2, d2 / 2);
    const a = [p1[0] + (p0[0] - p1[0]) * rr / d1, p1[1] + (p0[1] - p1[1]) * rr / d1], b = [p1[0] + (p2[0] - p1[0]) * rr / d2, p1[1] + (p2[1] - p1[1]) * rr / d2];
    for (let k = 0; k <= 12; k++) { const u = k / 12; out.push([(1 - u) * (1 - u) * a[0] + 2 * u * (1 - u) * p1[0] + u * u * b[0], (1 - u) * (1 - u) * a[1] + 2 * u * (1 - u) * p1[1] + u * u * b[1]]); }
  }
  out.push(pts[pts.length - 1]); return out;
};

// גיאומטריה של הסצנות

  [103, 'umbrella', 'סיכון', null], [129, 'gear', 'דמי ניהול', null], [155, 'magnifier', 'תשואות עבר', null],
].map(([a, id, label]) => { const r = a * Math.PI / 180; return { x: ROOT[0] + 420 * Math.cos(r), y: ROOT[1] - 360 * Math.sin(r), id, label }; });
// מתי כל צומת נחשף – לפי מיקום המילה בתוך המשפט
[C(3, 1) + 1.55, C(3, 1) + 3.05, C(3, 2) + 1.4, C(3, 3) + .1, C(3, 4) + .15, C(3, 4) + .95].forEach((t, k) => NODES[k].t = t);

const SH = {
  ul0: seg([1790, 560], [1000, 560]),                 // נמדד מחדש לפי הכותרת
  orbit: ell(560, 470, 350, 270),
  timeline: seg([940, 800], [180, 800]),
  arc: resample(quad(WAL, [530, 200], PIG2a)),
  fork: resample([].concat(
    quad(PIG2b, [PINS[0][0], PIG2b[1]], PINS[0]), quad(PINS[0], [PINS[0][0], PIG2b[1]], PIG2b),
    quad(PIG2b, [560, 480], PINS[1]), quad(PINS[1], [560, 480], PIG2b),
    quad(PIG2b, [PINS[2][0], PIG2b[1]], PINS[2]))),
  ring3: ell(560, 450, 250, 215),
  wave: t => resample(Array.from({ length: 121 }, (_, i) => { const x = 940 - 760 * i / 120; return [x, 770 + 16 * Math.sin(x / 55 + t * 3.2)]; })), // צורה דינמית: גל "נזיל"
  ground4: seg([980, 690], [140, 690]),
  div4: seg([560, 770], [560, 180]),
  div5: seg([960, 1130], [960, -50]),
  flow6: seg(FLOW[0], FLOW[2]),
  ring7: ell(ROOT[0], ROOT[1], 128, 108),
  branch: resample(NODES.flatMap(n => [ROOT, [n.x, n.y]])), // שלט ← צומת ← שלט ← צומת…
  snake: resample(fillet([[880, LANES[0]], [720, LANES[0]], [620, LANES[1]], [440, LANES[1]], [340, LANES[2]], [150, LANES[2]]], 70)),
  ring9: ell(560, 470, 300, 250),
  ul10: seg([1160, 470], [760, 470]),                 // נמדד מחדש לפי שם המוצר
};
// כמה מהענפים מצויר כשמגיעים לכל צומת (לפי אורך מצטבר)
const BR = (() => {
  const pts = NODES.flatMap(n => [ROOT, [n.x, n.y]]), L = [0];
  for (let i = 1; i < pts.length; i++) L.push(L[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  const tot = L[L.length - 1];
  return NODES.map((_, k) => ({ at: L[2 * k + 1] / tot, back: L[2 * k] / tot }));
})();

const shp = (name, t) => typeof SH[name] === 'function' ? SH[name](t) : SH[name];
function lineState(t) {
  let i = 0; while (i < K.length - 2 && K[i + 1][0] <= t) i++;
  const [t0, s0, c0, o0, d0] = K[i], [t1, s1, c1, o1, d1] = K[i + 1];
  const f = easeIO((t - t0) / ((t1 - t0) || 1)), a = shp(s0, t), b = shp(s1, t);
  return { pts: a.map((p, k) => [lerp(p[0], b[k][0], f), lerp(p[1], b[k][1], f)]), color: f < .5 ? c0 : c1, op: lerp(o0, o1, f), d: lerp(d0, d1, f) };
}
const lineHead = t => { const st = lineState(t); return st.pts[Math.round(clamp(st.d) * (N - 1))]; };
function drawLine(t) {

  el.setAttribute('stroke', st.color);
  el.setAttribute('opacity', st.op);
  el.setAttribute('stroke-dashoffset', 1 - st.d);
}

  ${blob('var(--pink)', FLOW[1][0], 470, 125, 105, A('pop', C(2, 7) + .15, .45))}${ic('bank', 'var(--ink)', FLOW[1][0], 465, 130, A('pop', C(2, 7) + .25, .45))}
  ${lbl('קופה משלמת לקצבה', FLOW[1][0], 600, 'var(--ink)', A('rise', C(2, 7) + .5, .45))}
  ${blob('var(--mint)', FLOW[2][0], 470, 125, 105, A('pop', C(2, 8) + .1, .45))}${ic('hand-coins', 'var(--ink)', FLOW[2][0], 470, 140, A('pop', C(2, 8) + .2, .45))}
  ${lbl('קצבה חודשית', FLOW[2][0], 600, 'var(--ink)', A('rise', C(2, 8) + .45, .45))}
  ${ic('calendar-check', 'var(--navy)', FLOW[2][0] - 105, 360, 76, A('pop', C(2, 8) + .7, .45))}
  ${ic('check-circle', 'var(--green)', FLOW[2][0] + 110, 360, 84, A('pop', C(2, 9) + .4, .5))}
  <div class="grp tok" data-a="0" data-t="${C(2, 7) + .95}" data-d=".9">${ic('coins', 'var(--ink)', 0, 0, 62)}</div>
  ${[0, 1, 2, 3].map(k => `<div class="grp tok" data-a="1" data-t="${C(2, 8) + 1.0 + k * .6}" data-d=".6">${ic('coins', 'var(--ink)', 0, 0, 52)}</div>`).join('')}`,
  (t, el) => el.querySelectorAll('.tok').forEach(tk => {
    const f = (t - +tk.dataset.t) / +tk.dataset.d, a = +tk.dataset.a, x = lerp(FLOW[a][0] - 70, FLOW[a + 1][0] + 70, easeIO(f));
    tk.style.opacity = f > 0 && f < 1 ? Math.min(1, f * 5, (1 - f) * 5) : 0;
    tk.style.transform = `translate(${x}px,470px)`;
  }), { ox: 960, oy: 540 });
hd(S6, C(2, 7), '', 'בנוסף', 'var(--navy)');
hd(C(2, 7), C(2, 8), 'העברה לקופה', 'משלמת לקצבה', 'var(--navy)');
hd(C(2, 8), C(2, 9), 'וקבלה', 'כקצבה חודשית', 'var(--navy)');
hd(C(2, 9), S7, 'עשויות להעניק', 'פטור ממס', 'var(--navy)', { sub: 'בהתאם לתנאי החוק' });

// 7 – איך בוחרים? הקו מתפצל מהשלט לשישה שיקולים
sc(S7, S8, 'var(--sky)', s => `
  ${blob('var(--cream)', ROOT[0], ROOT[1], 95, 80, A('pop', s + .4, .45))}${ic('signpost', 'var(--navy)', ROOT[0], ROOT[1] - 4, 112, A('pop', s + .5, .45))}
  ${NODES.map((n, k) => `<div class="mv" style="transform-origin:${n.x}px ${n.y}px;${k === 5 ? A('pulse', C(3, 5) + .2, .6, 'ease-in-out') : ''}">
    ${blob('var(--cream)', n.x, n.y, 70, 60, A('pop', n.t - .12, .45))}${ic(n.id, 'var(--navy)', n.x, n.y, 80, A('pop', n.t - .04, .45))}</div>
    ${lbl(n.label, n.x, n.y - 108, 'var(--navy)', A('rise', n.t + .1, .4))}`).join('')}`,
  null, { ox: ROOT[0], oy: ROOT[1] });
hd(S7, C(3, 1), 'איך בוחרים', `קופה שמתאימה לכם<span class="gap"></span>${Q_('var(--navy)', 'var(--cream)')}`, 'var(--navy)');
hd(C(3, 1), C(3, 2), 'קודם כול', 'מטרה וזמן', 'var(--navy)');
hd(C(3, 2), C(3, 5), 'לאחר מכן', 'בוחנים את המסלול', 'var(--navy)');
hd(C(3, 5), S8, 'תשואות עבר אינן מבטיחות', 'תשואה עתידית', 'var(--navy)');

// 8 – וכדאי לדעת: מעבר בין מסלולים בלי אירוע מס (הקופה "נוסעת" על הקו ועוברת נתיב)
sc(S8, S9, 'var(--mint60)', s => `
  <div class="grp rider">${ic('piggy', 'var(--ink)', 0, -52, 116, A('pop', s + .5, .45))}</div>`,
  (t, el) => { const p = lineState(t).d > .002 ? lineHead(t) : SH.snake[0]; el.querySelector('.rider').style.transform = `translate(${p[0]}px,${p[1]}px)`; },
  { ox: 880, oy: 420, bgHtml: s => `<svg style="position:absolute;inset:0" viewBox="0 0 ${W} ${H}">${LANES.map((y, k) => `<line x1="140" x2="880" y1="${y}" y2="${y}" stroke="${GREEN}" stroke-width="7" stroke-linecap="round" stroke-dasharray="0.1 26" style="${A('in', s + .4 + k * .12, .4)}"/>`).join('')}</svg>` });
hd(S8, C(3, 7), 'וכדאי', 'לדעת', 'var(--ink)');
hd(C(3, 7), S9, 'מעבר בין מסלולים', pill('ללא אירוע מס', 'f', 'background:var(--green);color:var(--ink)'), 'var(--ink)');

// 9 – מגוון מסלולים בכלל גמל לעתיד: השיקולים מתכנסים לקופה, והקו נסגר סביבה
sc(S9, S10, 'var(--cream)', s => `
  ${blob('var(--sky)', 560, 470, 210, 175, A('pop', s + .25, .5))}
  ${ic('piggy', 'var(--ink)', 560, 470, 250, A('pop', s + .35, .5))}
  ${NODES.map((n, k) => { const a = (30 + k * 60) * Math.PI / 180; return ic(n.id, 'var(--navy)', 560, 470, 84, `--dx:${Math.round(380 * Math.cos(a))}px;--dy:${Math.round(-300 * Math.sin(a))}px;${A('conv', s + .5 + k * .2, 1.3, 'cubic-bezier(.5,0,.75,0)')}`); }).join('')}
  ${ic('check-circle', 'var(--green)', 745, 315, 100, A('pop', C(4, 1) + .5, .5))}`,
  null, { ox: 560, oy: 470 });
hd(S9, C(4, 1), 'מגוון מסלולי השקעה', 'בכלל גמל לעתיד', 'var(--navy)');
hd(C(4, 1), S10, 'בחרו את המסלול', 'שמתאים לכם', 'var(--navy)');

// 10 – סיום: שם המוצר, לוגו כלל ביטוח ופיננסים וגילוי נאות
sc(S10, T, 'var(--cream)', s => `
  <div id="endTitle" class="l" style="position:absolute;left:0;right:0;top:300px;text-align:center;font-size:104px;color:var(--navy);${A('rise', s + .15, .6)}"><span>כלל גמל לעתיד</span></div>
  <div class="logo" style="position:absolute;left:${(W - 640) / 2}px;top:560px;width:640px;color:var(--ink);${A('in', s + .55, .6)}">${tpl('logoline')}</div>
  <div class="r" style="position:absolute;left:260px;right:260px;top:900px;text-align:center;font-size:26px;line-height:1.5;color:var(--ink);${A('in', s + .9, .5)}">[מקום שמור לנוסח הגילוי הנאות המאושר]</div>`,
  null, { ox: 960, oy: 470 });

// ---------- בניית DOM ----------
const stage = document.getElementById('stage'), bgL = document.getElementById('bgL');
stage.insertAdjacentHTML('beforeend', `<svg id="lineLayer" viewBox="0 0 ${W} ${H}"><polyline id="gline" fill="none" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1"/></svg><div id="fgL"></div><div id="topL"><div id="cap" class="r"></div><div id="corner">${tpl('logoline')}</div></div>`);
const fgL = document.getElementById('fgL');
const REV = .8; // משך חשיפת הרקע
S.forEach(o => {
  if (o.bg) {
    const b = document.createElement('div'); b.className = 'bg';
    b.style.cssText = `background:${o.bg};--ox:${o.o.ox ?? 960}px;--oy:${o.o.oy ?? 540}px;${o.o.noReveal ? '' : A('reveal', o.s, REV, 'cubic-bezier(.65,0,.35,1)')}`;
    b.innerHTML = o.o.bgHtml ? o.o.bgHtml(o.s) : ''; bgL.appendChild(b); o.bgEl = b;
  }
  const d = document.createElement('div'); d.className = 'sc'; d.innerHTML = o.html; fgL.appendChild(d); o.el = d;
});

// מדידות חד-פעמיות אחרי טעינת הפונטים: הקו הופך לקו תחתון מתחת לכותרת הראשונה ולשם המוצר
let measured = false;
function measure() {
  const under = (sel, dy) => {
    const el = document.querySelector(sel), host = el.closest('.sc'), anim = [...host.querySelectorAll('[style*="animation"]')];
    const saved = anim.map(a => a.style.animation); anim.forEach(a => a.style.animation = 'none'); host.style.display = 'block';
    const r = el.getBoundingClientRect(); host.style.display = 'none'; anim.forEach((a, i) => a.style.animation = saved[i]);
    return seg([r.right, r.bottom + dy], [r.left, r.bottom + dy]);
  };
  SH.ul0 = under('#h0 .h2t', 24);
  SH.ul10 = under('#endTitle span', 26);
  measured = true;
}

// כתוביות: המשפט הפעיל, ממורכז; במסך המפוצל – מתחת לחצי שעליו מדברים
const capEl = document.getElementById('cap'), cornerEl = document.getElementById('corner');
const inNavy = t => (t >= S3 + .35 && t < S4 + .35) || (t >= S5 + .45 && t < S6 + .35);
function captions(t) {
  const cs = CUES.cues;
  let k = -1;
  for (let i = 0; i < cs.length; i++) if (t >= cs[i].start - .08) k = i;
  const c = cs[k];
  const until = c ? Math.min(c.end + .6, k + 1 < cs.length ? cs[k + 1].start - .08 : T) : 0;
  const show = c && t < until && !(c.sec === 4 && c.i === 2); // בסיום הלוגו מדבר בעד עצמו
  if (!show) { capEl.style.opacity = 0; return; }
  if (capEl.dataset.k !== String(k)) { capEl.textContent = c.text; capEl.dataset.k = k; }
  let cx = 960, w = 1500, col = inNavy(t) ? CREAM : INK;
  if (c.sec === 2 && (c.i === 2 || c.i === 3)) { cx = 1440; w = 820; col = CREAM; }
  if (c.sec === 2 && (c.i === 4 || c.i === 5)) { cx = 480; w = 820; col = NAVY; }
  capEl.style.left = (cx - w / 2) + 'px'; capEl.style.width = w + 'px'; capEl.style.color = col;
  capEl.style.opacity = Math.min(clamp((t - c.start + .08) / .15), clamp((until - t) / .15));
}

window.__setTime = t => {
  if (!measured) measure();
  S.forEach(o => {
    const on = t >= o.s && t < o.e;
    o.el.style.display = on ? 'block' : 'none';
    o.el.style.opacity = on ? clamp((o.e - t) / .25) : 0;
    if (o.bgEl) o.bgEl.style.display = (t >= o.s && t < o.e + REV + .1) ? 'block' : 'none';
  });
  document.getAnimations().forEach(a => { a.pause(); a.currentTime = t * 1000; });
  S.forEach(o => { if (o.upd && t >= o.s && t < o.e) o.upd(t, o.el, o.s); });
  drawLine(t);
  captions(t);
  cornerEl.style.color = inNavy(t) ? CREAM : INK;
  cornerEl.style.opacity = clamp((S10 - t) / .3);
};
window.__duration = T;
if (!navigator.webdriver) { const st = performance.now(); (function tick(){ __setTime(((performance.now() - st) / 1000) % T); requestAnimationFrame(tick); })(); }
</script>
</body>
</html>
